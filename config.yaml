# All tunables live here. Secrets live in .env (see .env.example).
# Every value shown is the default the code falls back to if the key is removed.

db_path: state.db

profit:
  transaction_fee_pct: 0.095      # StockX seller Level 1
  processing_fee_pct: 0.03
  shipping_to_stockx_eur: 7.00    # flat label cost per unit, Estonia -> Eindhoven
  undercut_eur: 0.00              # list_ask scenario: undercut lowest ask by this much

alias:
  # Alias = GOAT's seller app, as a SECOND place to sell the same pair.
  # It has no public API and its pages are behind bot protection, so prices
  # cannot be read automatically without evasion (which this project doesn't
  # do). Instead every alert states the price Alias must pay to beat StockX,
  # with a link to check it by hand. Fees verified 2026-07-27 (alias.org/fees).
  enabled: true
  commission_pct: 0.095     # seller rating >= 90; drops to 15/20/25% if rating falls
  cashout_pct: 0.029        # ACH / PayPal withdrawal fee
  seller_fee_eur: 5.0       # region-dependent flat fee â€” CHECK YOURS in the app
  shipping_eur: 7.0         # your cost to ship to their hub

vat:
  # Kept fully isolated in profit.vat_wedge(). Flipping enabled touches nothing else.
  enabled: false
  rate: 0.24                      # Estonia standard rate
  input_vat_reclaimable: false    # can you reclaim VAT paid on the retail purchase?
  output_vat_on_sale: false       # do you owe VAT out of the StockX sale price?

filters:
  min_profit_eur: 10.0            # net profit that must be cleared
  require_live_bid: true          # profit is judged on the SELL NOW payout
                                  # (highest bid); items where only the
                                  # list-at-ask scenario is profitable stay quiet
  max_retail_price_eur: 500.0     # skip items costing more than this
  alert_min_confidence: 0.90      # below this -> review queue, never a firm alert
  # Liquidity floors. The official StockX API exposes NO bid/ask counts or sales
  # velocity, so these only apply when the market-data provider supplies them
  # (e.g. a future KicksDB provider). strict_liquidity: true would skip items
  # whose provider can't report these fields at all.
  min_bids: 1
  min_sales_72h: 0
  strict_liquidity: false

alerts:
  max_per_scan: 20                # per-opportunity messages per scan; the rest are
                                  # not lost â€” they alert on the next cycle
  re_alert_profit_delta_eur: 10.0 # re-alert an already-seen opportunity if profit moves this much

stockx:
  currency: EUR
  daily_request_budget: 23500     # under the 25 000/24h hard limit, with
                                  # headroom left for retries and backoff
  min_request_interval_s: 1.05    # hard limit is 1 req/s
  market_refresh_minutes: 60      # fallback TTL; the per-SKU tiers below win
  # Bid re-check cadence, set by how close a SKU last came to clearing the
  # profit floor. This is what makes 15-minute scanning affordable: one
  # market-data call covers a whole product, and refreshing all ~3000 matched
  # products every 15 min would need 284 000 calls/day against a 23 500 budget.
  # So near-misses are watched closely and hopeless ones checked once a day.
  refresh_minutes_hot: 45         # profitable now, or within a whisker
  refresh_minutes_warm: 240       # within near_miss_eur of the floor
  refresh_minutes_cold: 1440      # bid nowhere near retail
  near_miss_eur: 30.0
  # Full-sweep settings: the real limiter is daily_request_budget above (StockX
  # allows 1 req/s), so these are deliberately high â€” every cycle grinds through
  # as much of the catalog as the budget allows, and resolutions cache forever.
  market_calls_per_scan: 1500     # max market-data product fetches per scan
  max_new_resolutions_per_scan: 2000  # style codes resolved (searched) per scan
  # Barcode -> exact variant lookups. Only spent on products that already look
  # profitable, and cached forever (barcodes never change), so the cost is
  # one-off per shoe/size. Rademar, SNS and Overkill supply EANs.
  gtin_lookups_per_scan: 400
  negative_cache_days: 3          # re-try style codes that resolved to nothing after this

notifications:
  method: discord                 # discord | telegram | console
                                  # --dry-run always overrides to console

retailers:
  # ---- Tier 1: Estonia (most frequent scans) ----
  ballzy:
    enabled: true
    scan_interval_minutes: 15
    request_delay_seconds: 2.5    # robots.txt asks Crawl-delay: 2; stay above it
    categories:
      - /en/men/sneakers
      - /en/women/sneakers
    max_pages: 50                 # per category; 60 products per page

  reede:
    enabled: true
    scan_interval_minutes: 15
    request_delay_seconds: 2.5
    categories:                   # page 1 of each is scanned every cycle (fresh)
      - /soodus                   # sale â€” where the money is
      - /mehed
      - /naised
    sitemap_slice_per_scan: 400   # backlog product pages revisited per scan
    # Brand list is evidence-based (see BRAND-EVIDENCE note in README): kept are
    # brands whose best observed live bid actually exceeded retail. Dropped
    # asics/salomon/converse/hoka/saucony â€” their best case bid still sat below
    # retail, so they can never clear the profit floor.
    slug_filters: [nike, jordan, adidas, new-balance, puma, reebok,
                   air-, dunk, yeezy, samba, gazelle, campus, handball, spezial]

  teamsport:
    enabled: true
    scan_interval_minutes: 15
    request_delay_seconds: 2.5
    categories:
      - /ee/category              # full grid; tiles carry style codes + prices
    max_pages: 80

  rademar:
    enabled: true
    scan_interval_minutes: 15
    request_delay_seconds: 2.5
    sitemap_slice_per_scan: 500   # ~= their whole filtered catalog
    slug_filters: [nike, jordan, adidas, new-balance, newbalance, puma, reebok]

  sportland:
    enabled: true
    scan_interval_minutes: 20     # biggest catalog; batched GraphQL queries
    request_delay_seconds: 4.0
    # 5000 (125 back-to-back GraphQL batches) made them start dropping our
    # connections on 2026-07-27 â€” verified afterwards that they still answer
    # fine at low volume, so this is a rate ceiling, not a block. 1200 = 30
    # batches per scan, which ran cleanly for hours.
    sitemap_slice_per_scan: 1200
    graphql_batch_size: 40
    slug_filters: [nike, jordan, adidas, new_balance, puma, reebok]

  # sportsdirect.ee: NOT implemented â€” the site drops connections from
  # non-browser clients (Frasers bot wall, verified 2026-07-27). Respecting
  # the no-anti-detection guardrail means it stays out until they open up.

  # ---- Tier 2: Baltics ----
  # DISABLED 2026-07-27: you cannot check out from the LV/LT storefronts from
  # Estonia, so their alerts carry buy links you cannot use. They are also
  # redundant â€” all three Sportland sites share one catalog at identical prices
  # (verified: HF9190-001 is EUR69.99 in stock on .ee, .lv and .lt alike), so
  # sportland.ee finds the same deals with a link you can actually buy from.
  # Only per-country STOCK differs. Re-enable if you ever get LV/LT delivery.
  sportland_lv:
    enabled: false
    scan_interval_minutes: 90
    request_delay_seconds: 4.0
    sitemap_slice_per_scan: 800   # see sportland note: keep group volume modest
    graphql_batch_size: 40
    slug_filters: [nike, jordan, adidas, new_balance, puma, reebok]

  sportland_lt:
    # ENABLED: a contact in Lithuania handles these under a profit-split
    # arrangement — he buys and sells on your behalf, so there is NO per-unit
    # cost to add. Profit figures for this source are correct as printed.
    enabled: true
    extra_cost_eur: 0.0
    buy_note: "LT store - handled by your LT contact"
    # .ee is always preferable, but LT is never suppressed: the storefronts
    # share a catalog and price while stock differs per country, and LT
    # routinely has sizes .ee does not.
    prefer_retailer: sportland
    scan_interval_minutes: 90
    request_delay_seconds: 4.0
    sitemap_slice_per_scan: 800   # see sportland note: keep group volume modest
    graphql_batch_size: 40
    slug_filters: [nike, jordan, adidas, new_balance, puma, reebok]

  # ---- Tier 3: EU (least frequent; big robots crawl-delays honored) ----
  sns:
    enabled: true
    scan_interval_minutes: 120
    request_delay_seconds: 10.0   # robots Crawl-delay: 10
    categories:
      - /collections/sale         # fresh discounts every scan, all pages
    max_pages: 10                 # sale collection pagination
    # Their robots.txt asks for a 10s crawl delay, which we honour â€” so the
    # limit is time, not politeness. 250 + sale pages is roughly 45 min of a
    # 120 min window, and covers their whole filtered catalog in under a day
    # instead of 8 days.
    sitemap_slice_per_scan: 250
    slug_filters: [nike, jordan, adidas, new-balance, asics, salomon, puma,
                   converse, vans, hoka, saucony, reebok, yeezy, dunk, samba]

  overkill:
    # Berlin boutique; hype-heavy stock. Ships to Estonia: DHL EUR13, 2-5 days
    # (verified on their shipping page 2026-07-27) â€” charged as landed cost.
    enabled: true
    scan_interval_minutes: 120
    request_delay_seconds: 4.0
    extra_cost_eur: 13.0
    buy_note: "Berlin â€” DHL to EE ~EUR13, 2-5 days (already in the profit figure)"
    categories:
      - /collections/sale
    sitemap_slice_per_scan: 120
    slug_filters: [nike, jordan, adidas, new-balance, asics, salomon, puma,
                   converse, vans, hoka, saucony, reebok, dunk, samba, yeezy]

  footshop:
    # DISABLED 2026-07-27: product pages answered 200 at first, then every
    # request (even previously-working URLs) started returning a 400 block
    # page â€” Cloudflare refusing non-browser clients. Their robots.txt sets no
    # Crawl-delay for "*", so this wasn't a politeness failure; getting past it
    # would mean browser-fingerprint spoofing, which this project doesn't do.
    # Flip to true to retest later; the scraper itself works.
    enabled: false
    scan_interval_minutes: 120
    request_delay_seconds: 10.0
    categories:
      - /en/sale                  # sale listing page 1
    sitemap_slice_per_scan: 50
    slug_filters: [sneakers, shoes]   # matches the category segment in slugs

  # NOT implemented (probed 2026-07-27):
  # stadium.fi        homepage OK but catalog paths 403 plain clients (Akamai)
  # endclothing/bstn  Magento+Next behind Akamai â€” fragile, revisit on demand
  # zalando/aboutyou  no usable public feed / partner-API only â€” skipped
